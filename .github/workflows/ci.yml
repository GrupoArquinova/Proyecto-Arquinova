name: Backend CI/CD Pipeline - Constructora Arquinova

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Run Automated Tests (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cachear dependencias Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compilar y Ejecutar Pruebas Automatizadas
        run: ./mvnw clean verify --batch-mode -Dspring.profiles.active=test
        env:
          DB_USERNAME: test
          DB_PASSWORD: test
          JWT_SECRET: test-secret-key-for-ci-pipeline-only-not-for-production
          MAIL_USERNAME: noreply@test.com
          MAIL_PASSWORD: test
          MAIL_FROM: noreply@test.com

      - name: Publicar Resultados de Pruebas
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Reporte de Pruebas JUnit
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Verificar Cobertura de Código (JaCoCo)
        run: |
          echo "=== Resumen de Cobertura JaCoCo ==="
          if [ -f target/site/jacoco/index.html ]; then
            echo "Reporte de cobertura generado exitosamente"
          else
            echo "Nota: Reporte JaCoCo no encontrado (requiere plugin en pom.xml)"
          fi

      - name: Subir Reporte de Cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 30

