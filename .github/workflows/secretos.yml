name: Detección de secretos (gitleaks)

# Revisa con gitleaks todo lo que entra por push o pull request para que ninguna clave, contraseña o token llegue al repositorio.
# Si encuentra algo el workflow falla y el log indica el archivo y la regla (el valor aparece enmascarado: REDACTED).
# Si salta un falso positivo, añade una regla en .gitleaks.toml (allowlist) o la huella en .gitleaksignore; nunca desactives el workflow.
# Nota: en cuentas de organización de GitHub, gitleaks-action puede pedir el secret GITLEAKS_LICENSE (gratis para cuentas personales).

on:
  push:
    branches: ["**"]
  pull_request:

# Permisos mínimos: solo leer el código (sin comentarios en el PR; el resultado se ve en el log del job)
permissions:
  contents: read

jobs:
  gitleaks:
    name: Buscar secretos en el código y su historial
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar el código con todo el historial
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ejecutar gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Redacta los valores encontrados en el log (el repositorio es público)
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
