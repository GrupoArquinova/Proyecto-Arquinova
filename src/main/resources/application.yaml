spring:
  application:
    name: constructora-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:constructora_web}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${MAIL_HOST:smtp.gmail.com}
          from: ${MAIL_FROM}

server:
  port: ${SERVER_PORT:8080}
  # Compresión de respuestas HTTP para mejor rendimiento
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain
    min-response-size: 2048

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ─── Spring Boot Actuator (Observabilidad y Health Checks) ────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

# ─── Información del servicio (expuesta en /actuator/info) ────────────────────
info:
  app:
    name: Constructora Backend - Grupo Arquinova
    version: 1.0.0
    description: API REST para la gestión de proyectos, lotes y usuarios del Grupo Arquinova
    java-version: 21
    framework: Spring Boot 3.2.5

# ─── Logging estructurado ──────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.constructora_backend: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"