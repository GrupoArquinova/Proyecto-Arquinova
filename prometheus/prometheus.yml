global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "constructora-backend"
    metrics_path: "/actuator/prometheus"
    # La API solo entrega las métricas a quien presente este token (variable METRICAS_TOKEN del backend)
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metricas_token
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8080"]
        labels:
          application: "constructora-backend"
          environment: "production"
