services:
  # ─── Base de Datos Relacional: MySQL 8.0 ────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: constructora-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-constructora_db}
      # OPCIONAL: Si deseas crear un usuario adicional que no sea root:
      # MYSQL_USER: constructora_user
      # MYSQL_PASSWORD: constructora_password
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql

  # ─── Almacén Clave-Valor y Caché Distribuida: Redis 7 ───────────────────────
  redis:
    image: redis:7-alpine
    container_name: constructora-redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        else
          exec redis-server --appendonly yes
        fi
      '
    ports:
      - "${REDIS_PORT_FORWARD:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - constructora-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cola de Mensajes Asíncrona: RabbitMQ ──────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: constructora-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - constructora-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Backend API REST: Spring Boot 3 + Java 21 ──────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: constructora-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-constructora_web}
      DB_USERNAME: ${DB_USERNAME:-constructora_user}
      DB_PASSWORD: ${DB_PASSWORD:-constructora_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET - definela en el archivo .env (minimo 32 caracteres)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@constructora.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-secret}
      MAIL_FROM: ${MAIL_FROM:-noreply@constructora.com}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-arquinova}
      FLYWAY_ENABLED: "true"
      RABBITMQ_AUTO_STARTUP: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - constructora-net

  # ─── Recolección de Métricas: Prometheus ────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: constructora-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - constructora-net
    depends_on:
      - backend

  # ─── Paneles de Control y Alertas: Grafana ─────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: constructora-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - constructora-net
    depends_on:
      - prometheus

networks:
  constructora-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local