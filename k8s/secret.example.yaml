# ============================================================
# PLANTILLA del Secret de Kubernetes (esta si va en git).
# El archivo real k8s/secret.yaml NO se sube al repositorio (.gitignore).
#
# Uso:
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # reemplazar cada CHANGE_ME por el valor real
#   kubectl apply -f k8s/secret.yaml
#
# Generar un JWT_SECRET seguro (64 caracteres hex = 256 bits):
#   openssl rand -hex 32
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: constructora
type: Opaque
stringData:
  DB_USERNAME: "constructora_user"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION_DB_PASSWORD"
  DB_ROOT_PASSWORD: "CHANGE_ME_IN_PRODUCTION_ROOT_PASSWORD"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION_REDIS_PASSWORD"
  RABBITMQ_USERNAME: "rabbit_prod_user"
  RABBITMQ_PASSWORD: "CHANGE_ME_IN_PRODUCTION_RABBITMQ_PASSWORD"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_JWT_SECRET_MIN_32_CHARS"
  MAIL_USERNAME: "notificaciones@constructora.com"
  MAIL_PASSWORD: "CHANGE_ME_IN_PRODUCTION_SMTP_PASSWORD"
  CLOUDINARY_API_KEY: "CHANGE_ME_IN_PRODUCTION_CLOUDINARY_API_KEY"
  CLOUDINARY_API_SECRET: "CHANGE_ME_IN_PRODUCTION_CLOUDINARY_API_SECRET"
